<!doctype html>
<!--
  M31 fake booking page (F6). Every name and message here is FAKE. Opened from disk in Brave with a
  temporary profile; it loads nothing from the network. Like F5 (M29), its text fields start FILLED, so a
  question asks for exactly one right action (set_text replaces, insert_text adds at the end). The buttons
  and the link show their effect in the Status line; every other control shows it in its own value.
  Committed before any measurement (M31), then shortened once, still before any model saw it: the
  structure check read the first version and "Group room", "Building" and "Seats" fell beyond
  read_active_window's 1,200-character cut. Each line of a read is indented by its depth (18 spaces here),
  and a heading is read twice. So: no heading, the Status line and the notes sit below the controls (a cut
  loses them first), two shorter starting values, Seats before Building and with two choices, tighter
  spacing (a control scrolled off screen isn't read at all). No control a question asks for was renamed.
  Its wordings were run through redact() before committing (none changed). "Whiteboard (fake)." on its own
  was masked as a name, which is why that value keeps its "One".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Pseudo M31 fake booking</title>
  <style>
    body { font: 14px "Segoe UI", sans-serif; margin: 12px; max-width: 720px; }
    label, button, input, select, textarea, a { display: block; margin: 3px 0; font: inherit; }
  </style>
</head>
<body>
  <button onclick="setStatus('Status: availability checked (fake)')">Check availability</button>
  <button onclick="setStatus('Status: form cleared (fake)')">Clear the form</button>
  <a href="#rules" onclick="setStatus('Status: house rules shown (fake)')">View house rules</a>
  <input aria-label="Booking title" value="Study (fake)">
  <input aria-label="Purpose" value="Meeting (fake)">
  <textarea aria-label="Equipment needed" rows="2">One whiteboard (fake).</textarea>
  <label><input type="checkbox"> Need a projector</label>
  <label><input type="checkbox"> Repeat weekly</label>
  <label><input type="radio" name="slot" checked> Morning slot</label>
  <label><input type="radio" name="slot"> Afternoon slot</label>
  <label><input type="radio" name="slot"> Evening slot</label>
  <label><input type="radio" name="room" checked> Quiet room</label>
  <label><input type="radio" name="room"> Group room</label>
  <select aria-label="Seats">
    <option>Four</option><option>Six</option>
  </select>
  <select aria-label="Building">
    <option>Library</option><option>Science block</option><option>Main hall</option>
  </select>
  <input aria-label="Sentinel (never changes)" value="SENTINEL-44">

  <p id="status">Status: nothing done yet (fake)</p>
  <h2 id="rules">House rules</h2>
  <p>Fake rules: no food, lights off at nine, doors shut. All data on this page is fake.</p>

  <script>
    function setStatus(text) { document.getElementById('status').textContent = text; }
  </script>
</body>
</html>
